# Avoid persisting OAuth codes, tokens or personal search terms in query logs.
log_format vremix_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=vremix_bridge:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name v-remix.vietnamsir.com;
    access_log /var/log/vremix/access.log vremix_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vremix-acme;
        try_files $uri =404;
    }
    location / { return 301 https://v-remix.vietnamsir.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name v-remix.vietnamsir.com;
    root /opt/vremix/current;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/v-remix.vietnamsir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v-remix.vietnamsir.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VRemixTLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 16m;
    access_log /var/log/vremix/access.log vremix_safe;
    error_log /var/log/vremix/nginx-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /favicon.ico { rewrite ^ /seo.php?kind=favicon last; }
    location = /robots.txt { rewrite ^ /seo.php?kind=robots last; }
    location = /sitemap.xml { rewrite ^ /seo.php?kind=sitemap last; }
    location = /site.webmanifest { rewrite ^ /seo.php?kind=manifest last; }
    location = /local-generate.php { return 403; }
    # Cookies stay inside the container. Only authenticated bridge calls pass.
    location = /private-gemini/health {
        limit_except GET { deny all; }
        access_log off;
        proxy_pass http://127.0.0.1:8791/health;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /private-gemini/v1/images/generate {
        limit_except POST { deny all; }
        limit_req zone=vremix_bridge burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 24m;
        access_log off;
        proxy_pass http://127.0.0.1:8791/v1/images/generate;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 110s;
    }
    location /private-gemini/ { return 404; }
    # Retain compatibility with root-relative URLs from the localhost catalog.
    location /aiarenavietnam2026/ {
        rewrite ^/aiarenavietnam2026/(.*)$ /$1 last;
    }
    location ~ /\. { return 404; }
    location ~ ^/(config|src|includes|services|storage|supabase|database|docs|tests|deploy|scripts)(/|$) {
        return 404;
    }
    location ~ \.(md|sql|toml|lock|ya?ml|env|ini|log|bak|sh|py|cjs|mjs|map|ts)$ { return 404; }
    location ~ ^/(index|studio|studio-advisor|minh-chung|admin|admin-api|auth|auth-google|auth-callback|generation-edge|look-api|studio-draft|studio-collections-api|studio-history|catalog-search|shops|seo|brand-asset)\.php$ {
        try_files $uri =404;
        include /www/server/nginx/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9183;
        fastcgi_read_timeout 170s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / { try_files $uri $uri/ =404; }
}
