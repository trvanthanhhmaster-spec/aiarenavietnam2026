[global]
pid = /var/lib/vremix/php-fpm.pid
error_log = /var/log/vremix/php-fpm.log
daemonize = no

[vremix]
listen = 0.0.0.0:9000
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 500
clear_env = yes
env[GEMINI_WEB_LOCAL_ENABLED] = "false"
env[SUPABASE_CACHE_FILE] = /var/lib/vremix/cache/site-content.json
catch_workers_output = yes
request_terminate_timeout = 180s
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.use_strict_mode] = on
; Cookie defaults must stay overridable by SupabaseAuth::boot(), which sets
; the entire cookie policy in one call. Locking one key aborts that call.
php_value[session.cookie_secure] = 1
php_value[session.cookie_httponly] = 1
php_value[session.cookie_samesite] = Lax
php_admin_value[error_log] = /var/log/vremix/php-error.log
php_admin_value[session.save_path] = /var/lib/vremix/sessions
php_admin_value[upload_tmp_dir] = /var/lib/vremix/tmp
php_admin_value[sys_temp_dir] = /var/lib/vremix/tmp
php_admin_value[memory_limit] = 192M
php_admin_value[max_execution_time] = 160
php_admin_value[post_max_size] = 16M
php_admin_value[upload_max_filesize] = 12M
