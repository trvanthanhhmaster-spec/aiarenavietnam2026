# Temporary bootstrap: only the ACME challenge is public before TLS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name v-remix.vietnamsir.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/vremix-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
